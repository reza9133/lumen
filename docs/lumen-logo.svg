<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Lumen logo: a glowing paper lantern" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="70%">
      <stop offset="0" stop-color="#1d2340"/>
      <stop offset="1" stop-color="#090c1a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb454" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe8a0"/>
      <stop offset=".55" stop-color="#ffb454"/>
      <stop offset="1" stop-color="#e2792c"/>
    </linearGradient>
    <clipPath id="shape">
      <path d="M176 188 C176 168 206 156 256 156 C306 156 336 168 336 188 L350 300 C352 336 312 358 256 358 C200 358 160 336 162 300 Z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="262" r="210" fill="url(#glow)"/>

  <!-- string -->
  <path d="M256 70 V112" stroke="#ffe8a0" stroke-width="6" stroke-linecap="round"/>
  <circle cx="256" cy="64" r="9" fill="none" stroke="#ffe8a0" stroke-width="6"/>

  <!-- top cap -->
  <rect x="204" y="112" width="104" height="30" rx="9" fill="#5b3418"/>
  <rect x="190" y="138" width="132" height="20" rx="8" fill="#7a4a24"/>

  <!-- body -->
  <path d="M176 188 C176 168 206 156 256 156 C306 156 336 168 336 188 L350 300 C352 336 312 358 256 358 C200 358 160 336 162 300 Z" fill="url(#body)"/>
  <g clip-path="url(#shape)" fill="none" stroke="#a04f1c" stroke-opacity=".55" stroke-width="5">
    <path d="M214 150 C190 220 190 300 214 366"/>
    <path d="M256 150 V366"/>
    <path d="M298 150 C322 220 322 300 298 366"/>
    <path d="M150 232 C220 246 292 246 362 232"/>
    <path d="M150 300 C220 316 292 316 362 300"/>
  </g>

  <!-- flame -->
  <path d="M256 214 C282 244 280 276 256 292 C232 276 230 244 256 214 Z" fill="#fff6d6"/>
  <path d="M256 244 C268 258 267 274 256 282 C245 274 244 258 256 244 Z" fill="#ffd36e"/>

  <!-- bottom cap + tassel -->
  <rect x="204" y="354" width="104" height="22" rx="9" fill="#7a4a24"/>
  <rect x="226" y="372" width="60" height="16" rx="7" fill="#5b3418"/>
  <path d="M242 388 V428 M256 388 V438 M270 388 V428" stroke="#ffb454" stroke-width="6" stroke-linecap="round"/>

  <!-- rising sparks -->
  <g fill="#ffe8a0">
    <circle cx="372" cy="150" r="5" opacity=".9"/>
    <circle cx="392" cy="198" r="3.5" opacity=".7"/>
    <circle cx="136" cy="176" r="4" opacity=".8"/>
    <circle cx="118" cy="226" r="3" opacity=".6"/>
    <circle cx="360" cy="104" r="3" opacity=".6"/>
  </g>
</svg>
